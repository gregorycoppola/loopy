[project]
name = "loopy"
version = "0.1.0"
description = "Empirical study of loopy belief propagation on QBBN-structured factor graphs."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0,<2.10.0",
    "numpy>=1.26.0",
    "rich>=13.0.0",
]

[project.scripts]
loopy = "loopy.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopy"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]